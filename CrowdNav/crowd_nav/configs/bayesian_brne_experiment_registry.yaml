# SM-BRNE experiment registry (guide.md 10.8).
#
# STATUS: DRAFT / NOT YET FROZEN. This file's structure is fixed, but the
# values below are placeholders until Step 8 (CrowdSim integration smoke +
# latency benchmark) passes. Per guide.md: "之后不能看到测试结果再改阈值" --
# once frozen for a real run_id, changing a threshold requires a new run_id
# and a full rerun of affected methods. Do not edit this file's frozen
# values after a formal run starts; copy it and bump run_id instead.

frozen: false
run_id: null

configs:
  env_config: crowd_nav/configs/env_bayesian_brne.config
  policy_config: crowd_nav/configs/policy_bayesian_brne.config

artifact_hashes:
  frozen_model_sha256: null       # filled once Step 5's fit_bayesian_brne.py produces an artifact
  brne_commit: "633a5cdcb39ab27f18b596cb8cb1968644f82391"
  brne_license_sha256: null

methods:
  mechanistic_ablations:
    - original_brne
    - cv_brne
    - mean_brne
    - map_brne
    - uniform_brne
    - shuffled_brne
    - legacy_k3_full_posterior_brne
    - sm_brne_full_posterior
    - sm_brne_dense
    - sm_brne_sparse
  classical_baselines:
    - orca
    - social_force
    - cv_mpc
  learned_baselines:
    - lstm_rl
    - cadrl
    - sarl
    - dsrnn
    - mamba_vl

primary_hypotheses:
  H1: "heldout_interactive CR(CV-BRNE) - CR(SM-BRNE) suite-seed-block bootstrap 95% CI lower bound > 0"
  H2: "full_posterior beats posterior_mean/map_mode/shuffled_posterior on CR or near-collision rate (CI lower bound > 0), SR does not drop more than 2pp"
  H3: "nominal SR drop vs original BRNE <= 2pp, TR increase <= 2pp"
  H4: "20-person single-step planning p95 latency < 250ms (target < 125ms) at dt=0.25s"

metrics:
  primary: [SR, CR, TR]
  secondary:
    - near_collision_rate
    - min_clearance
    - navigation_time
    - path_length
    - path_efficiency
    - mean_acceleration
    - max_acceleration
    - oscillation_heading_changes
    - planner_latency
    - numeric_fallback_rate
    - emergency_stop_rate
  bayesian_mechanism:
    - heldout_transition_nll
    - brier_ece_coverage
    - posterior_entropy
    - mode_occupancy
    - mode_transition_matrix
    - brne_weight_entropy
    - cv_vs_posterior_action_disagreement
    - belief_corruption_performance_drop

scenarios:
  baseline_circle: {shape: circle, size: 4.0, human_num: 5}
  baseline_square: {shape: square, size: 10.0, human_num: 10}
  dense_circle: {shape: circle, size: 4.0, human_num: 10}
  dense_square: {shape: square, size: 10.0, human_num: 20}
  large_circle: {shape: circle, size: 6.0, human_num: 12}
  large_square: {shape: square, size: 14.0, human_num: 20}

profiles: [nominal, heldout_interactive]

seeds:
  suite_seeds: null    # e.g. [2407, 3407, 4407, 5407, 6407, 7407, 8407, 9407, 10407, 11407]
  episodes_per_cell: null

statistical_procedure:
  bootstrap_block_unit: suite_seed
  replicates: 2000
  multiple_comparison_correction: null   # or name the correction used; otherwise H1/H2 are the only primary comparisons
  pairing_key: [profile, scenario, suite_seed, episode_index, initial_state_hash]

failure_handling:
  missing_episode: error   # inner join must fail loudly, never pad by row number
  numeric_fallback: count_and_report
  artifact_hash_mismatch: reject_unless_allow_override
